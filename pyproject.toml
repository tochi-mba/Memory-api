[project]
name = "memory-api"
version = "0.1.0"
description = "The LUCY family's memory: what an assistant has learned about a person, with provenance, history and a topic index."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "REX Technologies" }]
keywords = ["assistant", "fastapi", "keyring", "lucy", "memory", "provenance"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "keyring-client",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "settings-client",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
memory-api = "memory_api.__main__:main"

[project.urls]
Repository = "https://github.com/tochi-mba/Memory-api"
Family = "https://github.com/tochi-mba/LUCY-assistant"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "cryptography>=43.0",
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "EM", "ERA", "F", "FA",
    "I", "ICN", "N", "PERF", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
    "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = ["ANN401", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"src/memory_api/api/routers/*" = ["TC001", "TC002", "TC003"]
"src/memory_api/api/dependencies.py" = ["TC001", "TC002", "TC003"]
"src/memory_api/api/errors.py" = ["TC001", "TC002", "TC003"]
# pydantic resolves annotations at runtime, so a wire model's imports cannot hide in a
# type-checking block: the model would fail to build at import time.
"src/memory_api/api/schemas.py" = ["TC001", "TC002", "TC003"]
# The site checker is a command-line gate: printing its findings is its job.
"scripts/check_site.py" = ["T201"]
"tests/**" = [
    "ARG001", "ARG002", "S101", "S105", "S106", "S107", "SLF001",
    "PLR2004", "TC001", "TC002", "TC003", "PLC0415",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["memory_api"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
# `tests` is on the path because the eval suite imports `conftest` the way pytest makes it
# importable; without it mypy cannot see a module the tests certainly can.
mypy_path = ["src", "tests", "scripts"]
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["keyring_client.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["memory_api"]
omit = ["src/memory_api/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "memory_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Routers do not speak keyring directly"
type = "forbidden"
source_modules = ["memory_api.api.routers"]
forbidden_modules = ["keyring_client", "httpx", "jwt"]
allow_indirect_imports = true

# settings-client owns caching, revalidation, single-flight and outage behaviour. Reading it
# from anywhere else would re-implement those four, slightly wrong, and would show a user
# token to settings-api without the one module that knows how to degrade. The container
# builds the source through build_preference_source, so only direct imports are refused.
[[tool.importlinter.contracts]]
name = "Talking to settings-api stays behind the preferences module"
type = "forbidden"
source_modules = [
    "memory_api.api",
    "memory_api.auth",
    "memory_api.domain",
    "memory_api.store",
    "memory_api.core.config",
    "memory_api.core.consolidator",
    "memory_api.core.container",
    "memory_api.core.context",
    "memory_api.core.sweeper",
]
forbidden_modules = ["settings_client"]
allow_indirect_imports = true

[tool.uv.sources]
keyring-client = { git = "https://github.com/tochi-mba/Keyring-api", subdirectory = "clients/python", tag = "keyring-client-v0.1.0" }
settings-client = { git = "https://github.com/tochi-mba/Settings-api", subdirectory = "clients/python", tag = "settings-client-v0.4.1" }
